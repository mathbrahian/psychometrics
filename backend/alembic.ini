# Migraciones de la base de datos. La URL de conexión no va aquí: sale de app.config (variables de entorno).
#   alembic upgrade head                              aplicar las migraciones
#   alembic revision --autogenerate -m "descripción"  generar una migración nueva a partir de los modelos

[alembic]
script_location = migrations
# Agrega la carpeta del backend al sys.path para que env.py pueda importar el paquete `app`.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
