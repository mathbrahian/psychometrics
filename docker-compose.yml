services:
  extractor-vertex:
    build:
      context: .
      dockerfile: extractor-vertex/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      CORS_ORIGINS: http://localhost:3000
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
      GOOGLE_CLOUD_LOCATION: ${GCP_VERTEX_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json
    volumes:
      # Credenciales ADC de la cuenta de desarrollo, en solo lectura. En Cloud Run se usa la service account.
      - type: bind
        source: ${GCP_ADC_PATH}
        target: /secrets/adc.json
        read_only: true
        bind:
          create_host_path: false

  extractor-gemini:
    build:
      context: .
      dockerfile: extractor-gemini/Dockerfile
    ports:
      - "7070:7070"
    environment:
      PORT: 7070
      CORS_ORIGINS: http://localhost:3000
      # API key de AI Studio, desde .env. Nunca va en el repositorio.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "9090:9090"
    environment:
      PORT: 9090
      CORS_ORIGINS: http://localhost:3000
      # Usuario único. Se generan con backend/scripts/hash_password.py y van en .env.
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET:-}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # La llamada la hace el navegador, por eso es localhost y no el nombre del servicio.
      EXTRACTOR_VERTEX_URL: http://localhost:8080
    depends_on:
      - extractor-vertex
