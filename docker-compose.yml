services:
  extractor-vertex:
    build: ./extractor-vertex
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      CORS_ORIGINS: http://localhost:3000

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    environment:
      PORT: 8080
      # La llamada la hace el navegador, por eso es localhost y no el nombre del servicio.
      EXTRACTOR_VERTEX_URL: http://localhost:8080
    depends_on:
      - extractor-vertex
