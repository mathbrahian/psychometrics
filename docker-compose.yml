services:
  extractor-vertex:
    build: ./extractor-vertex
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      CORS_ORIGINS: http://localhost:3000
      GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
      GOOGLE_CLOUD_LOCATION: ${GCP_VERTEX_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json
    volumes:
      # Credenciales ADC de la cuenta de desarrollo, en solo lectura. En Cloud Run se usa la service account.
      - type: bind
        source: ${GCP_ADC_PATH}
        target: /secrets/adc.json
        read_only: true
        bind:
          create_host_path: false

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    environment:
      PORT: 8080
      # La llamada la hace el navegador, por eso es localhost y no el nombre del servicio.
      EXTRACTOR_VERTEX_URL: http://localhost:8080
    depends_on:
      - extractor-vertex
