name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # necesario para Workload Identity Federation

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [libs/questionnaire-core, extractor-vertex, extractor-gemini]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # La librería se instala desde el mismo commit: los cambios de la librería y de los servicios se prueban juntos.
      - run: pip install -e "libs/questionnaire-core[dev]"
      - run: if [ -f ${{ matrix.package }}/requirements.txt ]; then pip install -r ${{ matrix.package }}/requirements.txt; fi
      - run: pytest -v
        working-directory: ${{ matrix.package }}

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-python, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Los extractores se construyen desde la raíz para incluir la librería compartida.
          - service: extractor-vertex
            port: 8080
            context: .
          - service: extractor-gemini
            port: 7070
            context: .
          - service: frontend
            port: 3000
            context: frontend
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/psychometrics/${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build y push de la imagen
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -t $IMAGE -f ${{ matrix.service }}/Dockerfile ${{ matrix.context }}
          docker push $IMAGE

      # Las variables de entorno, secretos y service account ya están configurados en cada servicio
      # de Cloud Run y se conservan entre despliegues.
      - name: Deploy en Cloud Run
        run: |
          gcloud run deploy ${{ matrix.service }} \
            --image=$IMAGE \
            --port=${{ matrix.port }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --region=${{ vars.GCP_REGION }}
